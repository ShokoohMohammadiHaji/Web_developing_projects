
<!DOCTYPE html>
<html>
<head>
    <title>Task 1 Calculator</title>

    <style>
        input[type="number"] {
            width: 100px;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body>

    <h2>Task 1 Calculator</h2>

    <input type="number" id="number1" placeholder="First number">

    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <input type="number" id="number2" placeholder="Second number">

    <button id="calculate">=</button>
    <span id="result"></span>

    <script>
        document.getElementById("calculate").onclick = function() {
            let a = Number(document.getElementById("number1").value);
            let b = Number(document.getElementById("number2").value);
            let op = document.getElementById("operator").value;
            let result;

            if (document.getElementById("number1").value === "" ||
                document.getElementById("number2").value === "") {
                document.getElementById("result").innerHTML =
                    " Please enter both numbers.";
                return;
            }

            if (op == "+") {
                result = a + b;
            } else if (op == "-") {
                result = a - b;
            } else if (op == "*") {
                result = a * b;
            } else if (op == "/") {
                if (b == 0) {
                    document.getElementById("result").innerHTML =
                        " Cannot divide by zero!";
                    return;
                }
                result = a / b;
            }

            document.getElementById("result").innerHTML = " " + result;
        };
    </script>

</body>
</html>
