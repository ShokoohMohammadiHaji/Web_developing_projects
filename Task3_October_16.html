
<!DOCTYPE html>
<html>
<head>
    <title>Task 3 Calculator</title>

    <style>
        input[type="number"] {
            width: 100px;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
</head>

<body>

    <h2>Task 3 Calculator</h2>

    <button id="increase1">+</button>
    <input type="number" id="number1" value="0">
    <button id="decrease1">-</button>

    <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
    </select>

    <button id="increase2">+</button>
    <input type="number" id="number2" value="0">
    <button id="decrease2">-</button>

    <button id="calculate">=</button>
    <span id="result"></span>

    <script>
        document.getElementById("increase1").onclick = function() {
            document.getElementById("number1").stepUp();
        };

        document.getElementById("decrease1").onclick = function() {
            document.getElementById("number1").stepDown();
        };

        document.getElementById("increase2").onclick = function() {
            document.getElementById("number2").stepUp();
        };

        document.getElementById("decrease2").onclick = function() {
            document.getElementById("number2").stepDown();
        };

        document.getElementById("calculate").onclick = function() {
            let a = Number(document.getElementById("number1").value);
            let b = Number(document.getElementById("number2").value);
            let op = document.getElementById("operator").value;
            let result;

            if (op == "+") {
                result = a + b;
            } else if (op == "-") {
                result = a - b;
            } else if (op == "*") {
                result = a * b;
            } else if (op == "/") {
                if (b == 0) {
                    document.getElementById("result").innerHTML =
                        " Cannot divide by zero!";
                    return;
                }
                result = a / b;
            }

            document.getElementById("result").innerHTML = " " + result;
        };
    </script>

</body>
</html>
