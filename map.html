<!DOCTYPE html>
<html >
<head>
    <title>Google Maps Search</title>
    <style>
        body { 
            font-family: Arial, Helvetica, sans-serif;
            background-color: rgb(251, 190, 111);
            color :black;
        }
        #mapframe {
            display: block;
            margin: 100px auto 10px auto ;
            border-radius: 10px;
        }
        .search-container{
            display: flex;
            justify-content:center ;
            align-items: center;
            gap: 10px;
            border-radius: 15%;
        }
        input{
            width: 200px;
            height: 25px;
            font-size: medium;
            
        }
        button{
            width: 100px;
            height: 30px;
            font-size: medium;
        }

    </style>
   
<body>
    <iframe src="https://maps.google.com/maps?q=LAB%20University%20of%20Applied%20Sciences%2C%20Lahti&output=embed" height="400"  width="75%"  id="mapframe"  frameborder="0"></iframe>
    <br>
    <br>
    <div class="search-container"> 
    <input type="text" id="city" value="" placeholder="Name of City" >
    <input type="text" id="street" value="" placeholder="Name of Street">
    <button id="search">Search</button>
    </div>
    <script>
        document.getElementById("search").onclick = searchOnMap;
        function searchOnMap (){

            let city = document.getElementById("city").value;
            let street = document.getElementById("street").value;
            let address = street + "," +city;
            console.log(city)
            console.log(street)
            console.log(address)
            document.getElementById("mapframe").src =  "https://maps.google.com/maps?q=" + encodeURIComponent(address) + "&output=embed";
    }

    </script>
</body>
</html>
